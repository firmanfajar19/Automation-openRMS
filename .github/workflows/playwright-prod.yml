name: Automation Tests - Production
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: PROD_ENV

    env:
      ENV: ${{ secrets.PROD_ENV }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_OUTPUT
        
      - name: Cache playwright binaries
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}  
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
        
      - name: Create .env file
        run: printf '%s' "$ENV" > .env

      - name: Run changed tests (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          npx bddgen
          npx playwright test --only-changed=origin/${{ github.base_ref }}

      - name: Run full Playwright tests
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm run test

      - name: Install Allure CLI
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm install -g allure-commandline

      - name: Restore Allure history
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Copy Allure history to allure-results
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p reports/allure-results/history
          cp -r gh-pages/history/* reports/allure-results/history/ || true

      - name: Create Allure Executor Info
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p reports/allure-results
          envsubst < reports/allure-executor.tpl.json > reports/allure-results/executor.json

      - name: Generate Allure Report
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm run allure

      - name: Deploy Allure Report to GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/allure-report
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload Allure Report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.workflow }}_Build#${{ github.run_number }}
          path: reports/allure-report
          retention-days: 30

      - name: Send Allure Summary to Email
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && always()
        uses: ./.github/actions/allure-summary
        with:
          smtp_host: ${{ secrets.SMTP_HOST }}
          smtp_port: ${{ secrets.SMTP_PORT }}
          smtp_user: ${{ secrets.SMTP_USER }}
          smtp_pass: ${{ secrets.SMTP_PASS }}
          email_to: ${{ secrets.EMAIL_TO }}
          repo_owner: ${{ github.repository_owner }}
          repo_name: ${{ github.event.repository.name }}