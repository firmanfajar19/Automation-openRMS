name: Tests
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false
  
jobs:
  test:
    environment: PROD_ENV

    env:
      ENV: ${{ secrets.PROD_ENV }}
      PROD_ENV: ${{ secrets.PROD_ENV }}

    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Get installed Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache playwright binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Create .env file
        run: |
          printf '%s' "$PROD_ENV" > .env

      - name: Verify env loaded
        run: cat .env | sed 's/=.*/=***/'

      - name: Restore Allure history (trend)
        uses: actions/cache@v4
        with:
          path: reports/allure-results/history
          key: allure-history-${{ github.ref_name }}
          restore-keys: |
            allure-history-

      - name: Ensure report directories exist
        run: |
          mkdir -p reports/allure-results
          mkdir -p reports/allure-results/history

      - name: Run changed tests (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          npx bddgen
          npx playwright test --only-changed=origin/${{ github.base_ref }}
        continue-on-error: true

      - name: Run tests production
        if: github.event_name != 'pull_request'
        run: npm run test
        continue-on-error: true

      - name: Generate Allure HTML report
        if: always()
        run: npm run allure
        continue-on-error: true

      - name: Update Allure history for next run
        if: always()
        run: |
          if [ -d reports/allure-report/history ]; then
            rm -rf reports/allure-results/history
            mkdir -p reports/allure-results/history
            cp -R reports/allure-report/history/* reports/allure-results/history/ || true
          fi
        continue-on-error: true

      - name: Save Allure history (trend)
        uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: reports/allure-results/history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: reports/allure-results/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: reports/allure-report/
          retention-days: 30

  deploy-pages:
    name: Deploy Allure report to GitHub Pages
    needs: test
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download allure-report artifact (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-report
          path: artifacts/allure-report

      - name: Prepare Pages site
        run: |
          rm -rf site
          mkdir -p site
          if [ -f artifacts/allure-report/index.html ]; then
            cp -R artifacts/allure-report/* site/
          elif [ -d reports/allure-report ]; then
            cp -R reports/allure-report/* site/
          else
            echo "No Allure report found" > site/index.html
          fi
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write Pages URL to summary
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
        