name: MonitPay Automation Tests - Production
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false
  
jobs:
  test:
    env: 
      PROD_ENV: ${{ secrets.PROD_ENV }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Get installed Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache playwright binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Create .env file
        run: |
          printf '%s' "$PROD_ENV" > .env

      - name: Verify env loaded
        run: cat .env | sed 's/=.*/=***/'

      - name: Restore test history
        uses: actions/cache@v4
        with:
          path: test-history.json
          key: test-history-${{ github.ref }}
          restore-keys: |
            test-history-

      - name: Run changed tests (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          npx bddgen
          npx playwright test --only-changed=origin/${{ github.base_ref }}
        continue-on-error: true

      - name: Run tests production
        if: github.event_name != 'pull_request'
        run: npm run test
        continue-on-error: true

      - name: Save test history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: test-history.json
          key: test-history-${{ github.ref }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-report
          path: smart-report.html
          retention-days: 30

  deploy-pages:
    name: Deploy smart-report to GitHub Pages
    needs: test
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download smart-report artifact (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: smart-report
          path: artifacts/smart-report

      - name: Prepare Pages site
        run: |
          rm -rf site
          mkdir -p site
          if [ -f artifacts/smart-report/smart-report.html ]; then
            cp artifacts/smart-report/smart-report.html site/index.html
          else
            cp smart-report.html site/index.html
          fi
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write Pages URL to summary
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
        