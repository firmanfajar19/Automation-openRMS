name: Playwright Regression - Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


permissions:
  contents: write
  pull-requests: write
 
jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/playwright-config.yml
    with:
      env_name: PRODUCTION
      environment: PROD_ENV
      secret_env: PROD_ENV
      run_changed_only: true
      deploy_report: false
      send_email: false

  prod-regression:
    if: github.event_name == 'push'
    uses: ./.github/workflows/playwright-config.yml
    with:
      env_name: PRODUCTION
      environment: PROD_ENV
      secret_env: PROD_ENV
      run_changed_only: false
      deploy_report: true
      send_email: true
