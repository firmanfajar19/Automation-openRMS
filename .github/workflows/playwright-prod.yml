name: Playwright Tests Prod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: PROD_ENV

    env:
      ENV: ${{ secrets.PROD_ENV }}

    steps:
      # ----------------------------------------
      # Checkout main branch
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ----------------------------------------
      # Setup Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      # ----------------------------------------
      # Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: npm ci

      # ----------------------------------------
      # Install Playwright browsers
      # ----------------------------------------
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ----------------------------------------
      # Create .env from secret
      # ----------------------------------------
      - name: Create .env from secret
        run: printf '%s' "$ENV" > .env

      # ----------------------------------------
      # Run changed tests (PR only)
      # ----------------------------------------
      - name: Run changed Playwright tests (PR only)
        if: github.event_name == 'pull_request'
        run: |
          npx bddgen
          npx playwright test --only-changed=origin/${{ github.base_ref }}

      # ----------------------------------------
      # Run full tests (push to main)
      # ----------------------------------------
      - name: Run Playwright tests
        if: github.event_name == 'push'
        run: npm run test

      # ----------------------------------------
      # Install Allure CLI
      # ----------------------------------------
      - name: Install Allure CLI globally
        run: npm install -g allure-commandline

      # ----------------------------------------
      # Restore Allure history from gh-pages
      # ----------------------------------------
      - name: Restore Allure history
        if: github.event_name == 'push'
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      # ----------------------------------------
      # Copy history to allure-results
      # ----------------------------------------
      - name: Copy Allure history
        if: github.event_name == 'push'
        run: |
          mkdir -p allure-results/history
          cp -r gh-pages/history allure-results/ || true

      # ----------------------------------------
      # Generate Allure report
      # ----------------------------------------
      - name: Generate Allure report
        run: npm run allure

      # ----------------------------------------
      # Save history back to gh-pages
      # ----------------------------------------
      - name: Save Allure history
        if: github.event_name == 'push'
        run: |
          cp -r allure-report/history gh-pages/ || true

      # ----------------------------------------
      # Run Allure Action
      # ----------------------------------------
      - name: Run Allure Action
        uses: allure-framework/allure-action@v0
        with:
          # Path to the generated report directory
          # By default, it's set to `./allure-report`
          report-directory: "./allure-report"
          # GitHub Token that's used for posting the comments in Pull Requests
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------
      # Upload artifact (optional)
      # ----------------------------------------
      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # ----------------------------------------
      # Deploy to GitHub Pages
      # ----------------------------------------
      - name: Deploy Allure Report to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          force_orphan: true

      # ----------------------------------------
      # Send Email with Allure Report Link
      # ----------------------------------------
      - name: Allure Summary & Email
        if: github.event_name == 'push'
        uses: ./.github/actions/allure-summary
        with:
          smtp_host: ${{ secrets.SMTP_HOST }}
          smtp_port: ${{ secrets.SMTP_PORT }}
          smtp_user: ${{ secrets.SMTP_USER }}
          smtp_pass: ${{ secrets.SMTP_PASS }}
          email_to: ${{ secrets.EMAIL_TO }}
          repo_owner: ${{ github.repository_owner }}
          repo_name: ${{ github.event.repository.name }}