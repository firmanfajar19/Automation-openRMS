name: Automation Tests - Staging
on:
  push:
    branches: staging
  
jobs:
  test:
    environment: STAGING_ENV
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Get installed Playwright version
      id: playwright-version
      run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_OUTPUT
    - name: Cache playwright binaries
      uses: actions/cache@v3
      id: playwright-cache
      with:
        path: |
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}   
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Create .env from secret
      run: |
        # write secret contents to .env without printing it to logs
        printf '%s' "$ENV" > .env
    - name: Run Playwright tests 
      run: npm run test
      continue-on-error: true
    - name: Install Allure CLI globally
      run: npm install -g allure-commandline
    - name: Generate Allure report
      run: npm run allure
    - name: Upload Allure report artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: ${{ github.workflow }}_Build#${{ github.run_number }}
        path: reports/allure-report/
        retention-days: 30
