name: Playwright Regression

on:
  workflow_call:
    inputs:
      env_name:
        required: true
        type: string
      environment:
        required: true
        type: string
      secret_env:
        required: true
        type: string
      deploy_report:
        required: true
        type: boolean
      send_email:
        required: true
        type: boolean
      run_changed_only:
        required: false
        type: boolean
        default: false
    secrets:
      SMTP_HOST:
        required: false
      SMTP_PORT:
        required: false
      SMTP_USER:
        required: false
      SMTP_PASS:
        required: false
      EMAIL_TO:
        required: false

jobs:
  regression:
    name: Regression Tests (${{ inputs.env_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}

    env:
      ENV: ${{ secrets[inputs.secret_env] }}

    steps:
      # Checkout
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Node
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      # Dependencies
      - run: npm ci

      # Cache Playwright
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Install browsers (safe to always run)
      - run: npx playwright install --with-deps

      # Create .env
      - run: printf '%s' "$ENV" > .env

      # Run tests
      - name: Run tests
        run: |
          npx bddgen
          if [[ "${{ inputs.run_changed_only }}" == "true" ]]; then
            npx playwright test --only-changed=origin/main
          else
            npm run test
          fi

      # Install Allure
      - run: npm install -g allure-commandline@2.36.0

      # Restore history
      - uses: actions/checkout@v5
        if: inputs.deploy_report
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Copy history
        if: inputs.deploy_report
        run: |
          mkdir -p allure-results/history
          cp -r gh-pages/history/* allure-results/history/ || true

      # Executor info
      - name: Create Allure Executor Info
        run: |
          mkdir -p allure-results
          cat <<EOF > allure-results/executor.json
          {
            "name": "GitHub Actions",
            "type": "github",
            "environment": "${{ inputs.env_name }}",
            "buildName": "Regression ${{ inputs.env_name }} #${{ github.run_number }}",
            "buildOrder": "${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      # Generate report
      - run: npm run allure

      # Deploy report
      - name: Deploy Allure
        if: inputs.deploy_report
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          force_orphan: true

      # Upload artifact
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: allure-report-${{ inputs.env_name }}
          path: allure-report
          retention-days: 30

      # Email
      - name: Send Allure Summary Email
        if: inputs.send_email && success()
        uses: ./.github/actions/allure-summary
        with:
          smtp_host: ${{ secrets.SMTP_HOST }}
          smtp_port: ${{ secrets.SMTP_PORT }}
          smtp_user: ${{ secrets.SMTP_USER }}
          smtp_pass: ${{ secrets.SMTP_PASS }}
          email_to: ${{ secrets.EMAIL_TO }}
