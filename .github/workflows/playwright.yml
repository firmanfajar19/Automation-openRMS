name: Playwright Regression Tests

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [[ "${{ github.ref_name }}" == "staging" ]]; then
            cat <<EOF >> "$GITHUB_OUTPUT"
            matrix={"include":[
              {
                "env_name": "STAGING",
                "branch": "staging",
                "environment": "STAGING_ENV",
                "secret_env": "STAGING_ENV",
                "deploy_report": false,
                "send_email": false
              }
            ]}
            EOF
          else
            cat <<EOF >> "$GITHUB_OUTPUT"
            matrix={"include":[
              {
                "env_name": "PRODUCTION",
                "branch": "main",
                "environment": "PROD_ENV",
                "secret_env": "PROD_ENV",
                "deploy_report": true,
                "send_email": true
              }
            ]}
            EOF
          fi

  regression:
    needs: setup
    name: Regression Tests (${{ matrix.env_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ matrix.environment }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      
    env:
      ENV: ${{ secrets[matrix.secret_env] }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Create .env file
        run: printf '%s' "$ENV" > .env

      - name: Run changed tests (PR → Production only)
        if: github.event_name == 'pull_request' && matrix.env_name == 'PRODUCTION'
        run: |
          npx bddgen
          npx playwright test --only-changed=origin/${{ github.base_ref }}

      - name: Run full tests
        if: github.event_name == 'push'
        run: npm run test

      - name: Install Allure CLI
        run: npm install -g allure-commandline@2.36.0

      - name: Restore Allure history
        if: matrix.deploy_report || github.event_name == 'push'
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Copy history
        if: matrix.deploy_report || github.event_name == 'push'
        run: |
          mkdir -p allure-results/history
          cp -r gh-pages/history/* allure-results/history/ || true

      - name: Create Allure Executor Info
        if: github.event_name == 'push'
        run: |
          mkdir -p allure-results
          cat <<EOF > allure-results/executor.json
          {
            "name": "GitHub Actions",
            "type": "github",
            "environment": "${{ matrix.env_name }}",
            "reportName": "Regression Tests (${{ matrix.env_name }}) - Build #${{ github.run_number }}",
            "buildName": "Regression ${{ matrix.env_name }} #${{ github.run_number }}",
            "buildOrder": "${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Generate Allure report
        run: npm run allure

      - name: Deploy Allure to GitHub Pages
        if: matrix.deploy_report || github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-report-${{ matrix.env_name }}
          path: allure-report
          retention-days: 30

      - name: Send Allure Summary Email
        if: matrix.send_email && github.event_name == 'push' && success()
        uses: ./.github/actions/allure-summary
        with:
          smtp_host: ${{ secrets.SMTP_HOST }}
          smtp_port: ${{ secrets.SMTP_PORT }}
          smtp_user: ${{ secrets.SMTP_USER }}
          smtp_pass: ${{ secrets.SMTP_PASS }}
          email_to: ${{ secrets.EMAIL_TO }}
          repo_owner: ${{ github.repository_owner }}
          repo_name: ${{ github.event.repository.name }}