name: "Extract Allure Summary & Send Email"
description: "Parse Allure summary, generate chart, and send email report"

inputs:
  smtp_host:
    required: true
  smtp_port:
    required: true
  smtp_user:
    required: true
  smtp_pass:
    required: true
  email_to:
    required: true
  repo_owner:
    required: true
  repo_name:
    required: true

runs:
  using: "composite"
  steps:
    - name: Extract Allure summary & Generate Chart
      shell: bash
      run: |
        node <<'EOF'
        const fs = require('fs');

        const summaryPath = 'reports/allure-report/widgets/summary.json';
        if (!fs.existsSync(summaryPath)) {
          console.error('Allure summary not found at: ' + summaryPath);
          process.exit(0);
        }

        const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
        const stat = summary.statistic;
        const durationMs = summary.time.duration || 0;

        const totalSeconds = Math.floor(durationMs / 1000);
        const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const s = String(totalSeconds % 60).padStart(2, '0');
        const duration = `${h}:${m}:${s}`;

        const passRate = stat.total > 0
          ? ((stat.passed / stat.total) * 100).toFixed(1)
          : '0.0';

        const chartConfig = {
          type: 'doughnut',
          data: {
            labels: ['Passed', 'Failed', 'Others'],
            datasets: [{
              data: [stat.passed, stat.failed, (stat.broken + stat.skipped + stat.unknown)],
              backgroundColor: ['#10b981', '#f43f5e', '#f59e0b'],
              hoverOffset: 4,
              borderWidth: 0
            }]
          },
          options: {
            legend: { display: false },
            plugins: {
              datalabels: {
                display: false,
              },
              doughnutlabel: {
                labels: [
                  { text: passRate + '%', font: { size: 26, weight: 'bold' }, color: '#1f2937' },
                  { text: 'PASSED', font: { size: 10, weight: 'bold' }, color: '#9ca3af' }
                ]
              }
            }
          }
        };

        const chartUrl = `https://quickchart.io/chart?c=${encodeURIComponent(JSON.stringify(chartConfig))}&w=250&h=250`;

        const env = process.env.GITHUB_ENV;
        fs.appendFileSync(env, `TOTAL_TESTS=${stat.total}\n`);
        fs.appendFileSync(env, `PASSED_TESTS=${stat.passed}\n`);
        fs.appendFileSync(env, `FAILED_TESTS=${stat.failed}\n`);
        fs.appendFileSync(env, `BROKEN_TESTS=${stat.broken + stat.skipped + stat.unknown}\n`);
        fs.appendFileSync(env, `EXECUTION_DURATION=${duration}\n`);
        fs.appendFileSync(env, `PASS_RATE=${passRate}\n`);
        fs.appendFileSync(env, `CHART_URL=${chartUrl}\n`);
        EOF

    - name: Send Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ inputs.smtp_host }}
        server_port: ${{ inputs.smtp_port }}
        username: ${{ inputs.smtp_user }}
        password: ${{ inputs.smtp_pass }}
        to: ${{ inputs.email_to }}
        from: "QA Team <${{ inputs.smtp_user }}>"
        subject: "🚀 Automation Test Report: ${{ inputs.repo_name }} | Build #${{ github.run_number }} [Success Rate: ${{ env.PASS_RATE }}%]"
        html_body: |
          <!DOCTYPE html>
          <html>
            <body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6;">
              <table width="100%" border="0" cellspacing="0" cellpadding="0" style="padding: 40px 10px;">
                <tr>
                  <td align="center">
                    <table width="600" border="0" cellspacing="0" cellpadding="0" style="background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);">
                      
                      <tr>
                        <td colspan="2" style="background-color: #1f2937; padding: 32px 40px;">
                          <h1 style="margin: 0; color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: -0.025em;">Test Execution Summary</h1>
                          <p style="margin: 4px 0 0 0; color: #9ca3af; font-size: 14px;">Build #${{ github.run_number }} &bull; ${{ inputs.repo_name }}</p>
                        </td>
                      </tr>

                      <tr>
                        <td colspan="2" style="padding:30px 40px 10px 40px; ">
                          <p style="margin:0;font-size:14px;line-height:1.7;color:#6b7280;">
                            <b>Hi Team,</b><br/><br/>
                            This is the summary of the latest automated test execution for
                            <strong>${{ inputs.repo_name }}</strong>.
                          </p>
                        </td>
                      </tr>

                      <tr>
                        <td colspan="2" align="center" style="padding: 40px 20px 30px 20px;">
                          <table border="0" cellspacing="0" cellpadding="0" width="100%">
                            <tr>
                              <td align="center">
                                <table
                                  border="0"
                                  cellspacing="0"
                                  cellpadding="0"
                                  width="500"
                                  style="
                                    background-color: #f9fafb;
                                    border-radius: 24px;
                                    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16);
                                  "
                                >
                                  <tr>
                                    <td colspan="2" align="center" style="padding: 40px 20px;">
                                      <img
                                        src="${{ env.CHART_URL }}"
                                        width="200"
                                        height="200"
                                        alt="Success Rate Chart"
                                        style="display: block;"
                                      />
                                    </td>
                                  </tr>
                                </table>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>

                      <tr>
                        <td colspan="2" style="padding: 0 40px 30px 40px;">
                          <table width="100%" border="0" cellspacing="0" cellpadding="0" style="border-collapse: collapse; margin-bottom: 10px;">
                            <tr style="border-bottom: 1px solid #e5e7eb;">
                              <td colspan="2" style="padding: 10px 0; font-size: 14px; color: #6b7280;">📋 Total Scenarios</td>
                              <td align="right" style="padding: 10px 0; font-size: 14px; font-weight: 700; color: #1f2937;">${{ env.TOTAL_TESTS }}</td>
                            </tr>
                            <tr style="border-bottom: 1px solid #e5e7eb;">
                              <td colspan="2" style="padding: 10px 0; font-size: 14px; color: #6b7280;">✅ Passed</td>
                              <td align="right" style="padding: 10px 0; font-size: 14px; font-weight: 700; color: #10b981;">${{ env.PASSED_TESTS }}</td>
                            </tr>
                            <tr style="border-bottom: 1px solid #e5e7eb;">
                              <td colspan="2" style="padding: 10px 0; font-size: 14px; color: #6b7280;">❌ Failed</td>
                              <td align="right" style="padding: 10px 0; font-size: 14px; font-weight: 700; color: #f43f5e;">${{ env.FAILED_TESTS }}</td>
                            </tr>
                            <tr style="border-bottom: 1px solid #e5e7eb;">
                              <td colspan="2" style="padding: 10px 0; font-size: 14px; color: #6b7280;">⚠️ Others (Broken/Skipped)</td>
                              <td align="right" style="padding: 10px 0; font-size: 14px; font-weight: 700; color: #f59e0b;">${{ env.BROKEN_TESTS }}</td>
                            </tr>
                            <tr style="border-bottom: 1px solid #e5e7eb;">
                              <td colspan="2" style="padding: 10px 0; font-size: 14px; color: #6b7280;">⏱️ Duration</td>
                              <td align="right" style="padding: 10px 0; font-size: 14px; font-weight: 700; color: #1f2937;">${{ env.EXECUTION_DURATION }}</td>
                            </tr>
                          </table>
                        </td>
                      </tr>

                      <tr>
                        <td colspan="2" style="padding: 0 40px 40px 40px; text-align: center;">
                          <table width="100%" border="0" cellspacing="0" cellpadding="0">
                            <tr>
                              <td>
                                <a href="https://${{ inputs.repo_owner }}.github.io/${{ inputs.repo_name }}" 
                                   style="display: block; background-color: #2563eb; color: #ffffff; padding: 14px; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; margin-bottom: 10px;">
                                   📊 Open Full HTML Report
                                </a>
                              </td>
                            </tr>
                            <tr>
                              <td>
                                <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" 
                                   style="display: block; background-color: #ffffff; color: #374151; padding: 14px; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; border: 1px solid #d1d5db;">
                                   🔍 View Workflow Execution
                                </a>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>

                      <tr>
                        <td style="background-color: #f9fafb; padding: 20px 40px; text-align: left;">
                          <p style="margin: 0; font-size: 12px; color: #9ca3af;">
                            This is an automated email from GitHub Actions.
                          </p>
                        </td>
                        <td style="background-color: #f9fafb; padding: 20px 40px; text-align: right;">
                          <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" width="30" height="30" style="opacity: 0.2;">
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
          </html>