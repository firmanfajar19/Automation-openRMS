name: "Extract Allure Summary & Send Email"
description: "Parse Allure summary, calculate metrics and send email with Donut Chart"

inputs:
  smtp_host:
    required: true
  smtp_port:
    required: true
  smtp_user:
    required: true
  smtp_pass:
    required: true
  email_to:
    required: true
  repo_owner:
    required: true
  repo_name:
    required: true

runs:
  using: "composite"
  steps:
    - name: Extract Allure summary
      shell: bash
      run: |
        node <<'EOF'
        const fs = require('fs');

        const summaryPath = 'reports/allure-report/widgets/summary.json';
        if (!fs.existsSync(summaryPath)) {
          console.log('Allure summary not found');
          process.exit(0);
        }

        const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
        const stat = summary.statistic;
        const durationMs = summary.time.duration || 0;

        const totalSeconds = Math.floor(durationMs / 1000);
        const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const s = String(totalSeconds % 60).padStart(2, '0');

        const duration = `${h}:${m}:${s}`;
        const passRate = stat.total > 0
          ? ((stat.passed / stat.total) * 100).toFixed(2)
          : '0.00';
        const chartConfig = {
          type: 'doughnut',
          data: {
            datasets: [{
              data: [stat.passed, stat.failed, (stat.broken + stat.skipped)],
              backgroundColor: ['#059669', '#dc2626', '#d97706'],
              borderWidth: 0
            }]
          },
          options: {
            plugins: {
              datalabels: { display: false },
              doughnutlabel: {
                labels: [
                  { text: passRate + '%', font: { size: 24, weight: 'bold' } },
                  { text: 'Success Rate', font: { size: 12 } }
                ]
              }
            }
          }
        };

        const chartUrl = `https://quickchart.io/chart?c=${encodeURIComponent(JSON.stringify(chartConfig))}`;

        const env = process.env.GITHUB_ENV;
        fs.appendFileSync(env, `TOTAL_TESTS=${stat.total}\n`);
        fs.appendFileSync(env, `PASSED_TESTS=${stat.passed}\n`);
        fs.appendFileSync(env, `FAILED_TESTS=${stat.failed}\n`);
        fs.appendFileSync(env, `BROKEN_TESTS=${stat.broken}\n`);
        fs.appendFileSync(env, `SKIPPED_TESTS=${stat.skipped}\n`);
        fs.appendFileSync(env, `EXECUTION_DURATION=${duration}\n`);
        fs.appendFileSync(env, `PASS_RATE=${passRate}\n`);
        fs.appendFileSync(env, `CHART_URL=${chartUrl}\n`);
        EOF

    - name: Send Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ inputs.smtp_host }}
        server_port: ${{ inputs.smtp_port }}
        username: ${{ inputs.smtp_user }}
        password: ${{ inputs.smtp_pass }}
        to: ${{ inputs.email_to }}
        from: "QA Team <${{ inputs.smtp_user }}>"
        subject: "🚀 Automation Test Report: [${{ inputs.repo_name }}] - [Build #${{ github.run_number }}]"
        html_body: |
          <html>
            <body style="margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background-color: #f9fafb; color: #1f2937;">
              <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #f9fafb; padding: 20px;">
                <tr>
                  <td align="center">
                    <table width="600" border="0" cellspacing="0" cellpadding="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #e5e7eb;">
                      
                      <tr>
                        <td style="background-color: #2563eb; padding: 30px 40px;">
                          <h1 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 700;">Automation Test Report</h1>
                          <p style="margin: 8px 0 0 0; color: #bfdbfe; font-size: 14px;">Workflow: ${{ github.workflow }}</p>
                        </td>
                      </tr>

                      <tr>
                        <td style="padding: 30px 40px;">
                          <p style="font-size: 16px; color: #4b5563;">Hi Team, berikut adalah ringkasan hasil eksekusi automation suite terbaru:</p>

                          <table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin: 20px 0; background-color: #f3f4f6; border-radius: 12px;">
                            <tr>
                              <td align="center" style="padding: 20px;">
                                <img src="${{ env.CHART_URL }}" width="220" height="220" alt="Success Rate Chart" style="display: block;">
                              </td>
                            </tr>
                          </table>

                          <h3 style="font-size: 16px; border-left: 4px solid #2563eb; padding-left: 10px; color: #111827;">Test Summary</h3>
                          <table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-bottom: 30px;">
                            <tr style="border-bottom: 1px solid #e5e7eb;">
                              <td style="padding: 10px 0; color: #6b7280;">📋 Total Scenarios</td>
                              <td align="right" style="font-weight: 600;">${{ env.TOTAL_TESTS }}</td>
                            </tr>
                            <tr>
                              <td style="padding: 10px 0; color: #059669;">✅ Passed</td>
                              <td align="right" style="font-weight: 600; color: #059669;">${{ env.PASSED_TESTS }}</td>
                            </tr>
                            <tr>
                              <td style="padding: 10px 0; color: #dc2626;">❌ Failed</td>
                              <td align="right" style="font-weight: 600; color: #dc2626;">${{ env.FAILED_TESTS }}</td>
                            </tr>
                            <tr>
                              <td style="padding: 10px 0; color: #d97706;">⚠️ Broken/Skipped</td>
                              <td align="right" style="font-weight: 600; color: #d97706;">${{ env.BROKEN_TESTS }} / ${{ env.SKIPPED_TESTS }}</td>
                            </tr>
                            <tr>
                              <td style="padding: 10px 0; color: #6b7280;">⏱️ Duration</td>
                              <td align="right" style="font-weight: 600;">${{ env.EXECUTION_DURATION }}</td>
                            </tr>
                          </table>

                          <table width="100%" border="0" cellspacing="0" cellpadding="0">
                            <tr>
                              <td align="center">
                                <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" 
                                   style="display: inline-block; padding: 12px 24px; background-color: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 14px;">
                                   📊 View Full HTML Report
                                </a>
                              </td>
                            </tr>
                          </table>

                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
          </html>