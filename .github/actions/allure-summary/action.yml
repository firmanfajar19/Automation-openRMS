name: "Extract Allure Summary & Send Email"
description: "Parse Allure summary, generate clean chart, and send professional email report"

inputs:
  smtp_host:
    required: true
  smtp_port:
    required: true
  smtp_user:
    required: true
  smtp_pass:
    required: true
  email_to:
    required: true
  repo_owner:
    required: true
  repo_name:
    required: true

runs:
  using: "composite"
  steps:
    - name: Extract Allure summary & Generate Chart URL
      shell: bash
      run: |
        node <<'EOF'
        const fs = require('fs');

        const summaryPath = 'reports/allure-report/widgets/summary.json';
        if (!fs.existsSync(summaryPath)) {
          console.error('Allure summary not found at: ' + summaryPath);
          process.exit(0);
        }

        const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
        const stat = summary.statistic;
        const durationMs = summary.time?.duration || 0;

        const totalSeconds = Math.floor(durationMs / 1000);
        const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const s = String(totalSeconds % 60).padStart(2, '0');
        const duration = `${h}:${m}:${s}`;

        const passRate = stat.total > 0
          ? ((stat.passed / stat.total) * 100).toFixed(1)
          : '0.0';

        const chartConfig = {
          type: 'doughnut',
          data: {
            labels: ['Passed', 'Failed', 'Others'],
            datasets: [{
              data: [
                stat.passed,
                stat.failed,
                stat.broken + stat.skipped + stat.unknown
              ],
              backgroundColor: ['#10b981', '#f43f5e', '#f59e0b'],
              borderWidth: 0
            }]
          },
          options: {
            cutout: '72%',
            plugins: {
              legend: { display: false },
              tooltip: { enabled: true },
              doughnutlabel: {
                labels: [
                  {
                    text: `Success Rate`,
                    font: { size: 12, weight: '600' },
                    color: '#6b7280'
                  },
                  {
                    text: `${passRate}%`,
                    font: { size: 28, weight: '700' },
                    color: '#111827'
                  }
                ]
              }
            }
          }
        };

        const chartUrl =
          `https://quickchart.io/chart?c=${encodeURIComponent(
            JSON.stringify(chartConfig)
          )}&w=260&h=260`;

        const env = process.env.GITHUB_ENV;
        fs.appendFileSync(env, `TOTAL_TESTS=${stat.total}\n`);
        fs.appendFileSync(env, `PASSED_TESTS=${stat.passed}\n`);
        fs.appendFileSync(env, `FAILED_TESTS=${stat.failed}\n`);
        fs.appendFileSync(env, `BROKEN_TESTS=${stat.broken + stat.skipped + stat.unknown}\n`);
        fs.appendFileSync(env, `EXECUTION_DURATION=${duration}\n`);
        fs.appendFileSync(env, `PASS_RATE=${passRate}\n`);
        fs.appendFileSync(env, `CHART_URL=${chartUrl}\n`);
        EOF

    - name: Send Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ inputs.smtp_host }}
        server_port: ${{ inputs.smtp_port }}
        username: ${{ inputs.smtp_user }}
        password: ${{ inputs.smtp_pass }}
        to: ${{ inputs.email_to }}
        from: "QA Team <${{ inputs.smtp_user }}>"
        subject: "🚀 Automation Test Report: ${{ inputs.repo_name }} | Build #${{ github.run_number }} [${{ env.PASS_RATE }}%]"
        html_body: |
          <!DOCTYPE html>
          <html>
          <body style="margin:0;padding:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 10px;">
              <tr>
                <td align="center">
                  <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 10px 15px -3px rgba(0,0,0,.1);">
                    <tr>
                      <td style="background:#1f2937;padding:32px 40px;">
                        <h1 style="margin:0;color:#ffffff;font-size:22px;">Test Execution Summary</h1>
                        <p style="margin:6px 0 0;color:#9ca3af;font-size:14px;">
                          Build #${{ github.run_number }} • ${{ inputs.repo_name }}
                        </p>
                      </td>
                    </tr>

                    <tr>
                      <td style="padding:30px 40px 10px 40px;">
                        <p style="margin:0;font-size:14px;line-height:1.7;color:#6b7280;">
                          <b>Hi Team,</b><br/><br/>
                          This is the summary of the latest automated test execution for
                          <strong>${{ inputs.repo_name }}</strong>.
                        </p>
                      </td>
                    </tr>

                    <tr>
                      <td align="center" style="padding:24px 40px;">
                        <img src="${{ env.CHART_URL }}" width="220" height="220" alt="Test Result Chart">
                      </td>
                    </tr>

                    <tr>
                      <td style="padding:0 40px 36px 40px;">
                        <table width="100%" cellspacing="0" cellpadding="0" style="border-top:1px solid #e5e7eb;margin-top:10px;">
                          <tr>
                            <td style="padding:14px 0;color:#6b7280;font-size:14px;">Total Scenarios</td>
                            <td align="right" style="padding:14px 0;color:#111827;font-weight:600;font-size:14px;">
                              ${{ env.TOTAL_TESTS }}
                            </td>
                          </tr>
                          <tr>
                            <td style="padding:14px 0;color:#6b7280;font-size:14px;">Passed</td>
                            <td align="right" style="padding:14px 0;color:#111827;font-weight:600;font-size:14px;">
                              ${{ env.PASSED_TESTS }}
                            </td>
                          </tr>
                          <tr>
                            <td style="padding:14px 0;color:#6b7280;font-size:14px;">Failed</td>
                            <td align="right" style="padding:14px 0;color:#111827;font-weight:600;font-size:14px;">
                              ${{ env.FAILED_TESTS }}
                            </td>
                          </tr>
                          <tr>
                            <td style="padding:14px 0;color:#6b7280;font-size:14px;">Others (Broken / Skipped)</td>
                            <td align="right" style="padding:14px 0;color:#111827;font-weight:600;font-size:14px;">
                              ${{ env.BROKEN_TESTS }}
                            </td>
                          </tr>
                          <tr>
                            <td style="padding:14px 0;color:#6b7280;font-size:14px;">Execution Duration</td>
                            <td align="right" style="padding:14px 0;color:#111827;font-weight:600;font-size:14px;">
                              ${{ env.EXECUTION_DURATION }}
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>

                    <tr>
                      <td style="padding:0 40px 40px 40px;text-align:center;">
                        <a href="https://${{ inputs.repo_owner }}.github.io/${{ inputs.repo_name }}"
                           style="display:block;background:#2563eb;color:#ffffff;padding:14px;border-radius:8px;text-decoration:none;font-weight:600;margin-bottom:12px;">
                          📊 Open Full HTML Report
                        </a>
                        <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                           style="display:block;border:1px solid #d1d5db;padding:14px;border-radius:8px;text-decoration:none;color:#374151;font-weight:600;">
                          🔍 View Workflow
                        </a>
                      </td>
                    </tr>

                    <tr>
                      <td style="background:#f9fafb;padding:20px 40px;text-align:center;">
                        <p style="margin:0;font-size:12px;color:#9ca3af;">
                          This is an automated email generated by GitHub Actions.
                        </p>
                      </td>
                    </tr>

                  </table>
                </td>
              </tr>
            </table>
          </body>
          </html>