name: "Extract Allure Summary & Send Email"
description: "Parse Allure summary, calculate metrics and send email"

inputs:
  smtp_host:
    required: true
  smtp_port:
    required: true
  smtp_user:
    required: true
  smtp_pass:
    required: true
  email_to:
    required: true
  repo_owner:
    required: true
  repo_name:
    required: true

runs:
  using: "composite"
  steps:
    - name: Extract Allure summary
      shell: bash
      run: |
        node <<'EOF'
        const fs = require('fs');

        const summaryPath = 'reports/allure-report/widgets/summary.json';
        if (!fs.existsSync(summaryPath)) {
          console.log('Allure summary not found');
          process.exit(0);
        }

        const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
        const stat = summary.statistic;
        const durationMs = summary.time.duration || 0;

        const totalSeconds = Math.floor(durationMs / 1000);
        const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const s = String(totalSeconds % 60).padStart(2, '0');

        const duration = `${h}:${m}:${s}`;
        const passRate = stat.total > 0
          ? ((stat.passed / stat.total) * 100).toFixed(2)
          : '0.00';

        const env = process.env.GITHUB_ENV;
        fs.appendFileSync(env, `TOTAL_TESTS=${stat.total}\n`);
        fs.appendFileSync(env, `PASSED_TESTS=${stat.passed}\n`);
        fs.appendFileSync(env, `FAILED_TESTS=${stat.failed}\n`);
        fs.appendFileSync(env, `BROKEN_TESTS=${stat.broken}\n`);
        fs.appendFileSync(env, `SKIPPED_TESTS=${stat.skipped}\n`);
        fs.appendFileSync(env, `EXECUTION_DURATION=${duration}\n`);
        fs.appendFileSync(env, `PASS_RATE=${passRate}\n`);
        EOF

    - name: Send Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ inputs.smtp_host }}
        server_port: ${{ inputs.smtp_port }}
        username: ${{ inputs.smtp_user }}
        password: ${{ inputs.smtp_pass }}
        to: ${{ inputs.email_to }}
        from: "QA Team <${{ inputs.smtp_user }}>"
        subject: "Regression Test Result"
        html_body: |
          <html>
            <body style="font-family: Arial, sans-serif; color:#333">
              <p>Hello Team,</p>

              <p>This is regression test results. Please find the summary below:</p>

              <h3>🔹 Test Report Summary</h3>
              <table border="1" cellpadding="8" cellspacing="0" width="400"
               style="border-collapse: collapse;">
                <tr style="background:#f2f2f2">
                  <th align="left">Metric</th>
                  <th align="center">Value</th>
                </tr>
                <tr><td>📋 Total Scenarios</td><td align="center">${{ env.TOTAL_TESTS }}</td></tr>
                <tr><td>✅ Passed</td><td align="center"> ${{ env.PASSED_TESTS }}</td></tr>
                <tr><td>❌ Failed</td><td align="center"> ${{ env.FAILED_TESTS }}</td></tr>
                <tr><td>⚠️ Broken</td><td align="center"> ${{ env.BROKEN_TESTS }}</td></tr>
                <tr><td>⏭️ Skipped</td><td align="center"> ${{ env.SKIPPED_TESTS }}</td></tr>
                <tr><td>⏱️ Execution Duration</td><td align="center"> ${{ env.EXECUTION_DURATION }}</td></tr>
                <tr><td>📈 Success Rate</td><td align="center"> ${{ env.PASS_RATE }}%</td></tr>
              </table>

              <h3>🔹 Test Report Links</h3>
              <table border="1" cellpadding="8" cellspacing="0" width="400"
               style="border-collapse: collapse;">
                <tr style="background:#f2f2f2">
                  <th align="left">Report Type</th>
                  <th align="left">Link</th>
                </tr>

                <tr>
                  <td>GitHub Workflow Run</td>
                  <td>
                    <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                      View Execution Details
                    </a>
                  </td>
                </tr>

                <tr>
                  <td>Regression Test Report</td>
                  <td>
                    <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}">
                      View Report
                    </a>
                  </td>
                </tr>
              </table>

              <p style="font-weight:600;">
                Regards,<br/>
                QA Team
              </p>
            </body>
          </html>
